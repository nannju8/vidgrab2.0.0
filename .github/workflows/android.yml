name: Build & Deploy VidGrab APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurer Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Compiler l'APK Debug (installable directement)
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Mettre l'APK en téléchargement (Archive ZIP ~17 Mo)
        uses: actions/upload-artifact@v7
        with:
          name: VidGrab-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          archive: true
          compression-level: 9
          retention-days: 30

      - name: Publier une GitHub Release (si tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
